name: Ringe aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/**", ".github/workflows/rings.yml"]

permissions:
  contents: write

jobs:
  rings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ring-Kalender erzeugen
        run: python3 tools/rings.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Committen, falls sich etwas geändert hat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rings.svg data/contributions.json
          git diff --cached --quiet || git commit -m "Ringe aktualisiert" && git push
